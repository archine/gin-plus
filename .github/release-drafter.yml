# Release Drafter 配置文件
# 文档：https://github.com/release-drafter/release-drafter
#
# 当 Pull Request 合并后，Release Drafter 会自动根据 PR 的 label
# 将其归类到对应的变更分组，并草拟带 emoji 的发布说明。
#
# 如何维护 label→emoji 映射：
#   在下方 categories 列表中增减条目即可，label 字段与 GitHub 仓库
#   Labels 页面中的标签名称保持一致。

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# 版本号解析策略（基于 label）
version-resolver:
  major:
    labels:
      - 'breaking-change'
      - 'major'
  minor:
    labels:
      - 'enhancement'
      - 'feat'
      - 'feature'
  patch:
    labels:
      - 'bug'
      - 'fix'
      - 'hotfix'
      - 'perf'
      - 'refactor'
      - 'docs'
      - 'test'
      - 'security'
      - 'release'
  default: patch

# 发布说明模板（中文，带 emoji）
template: |
  ## 📦 版本：$TITLE

  > 发布日期：待发布时填写

  $CHANGES

  ---
  **完整变更记录**：[$PREVIOUS_TAG...v$RESOLVED_VERSION](https://github.com/archine/gin-plus/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION)

# 变更分组（每个分组对应一组 label）
categories:
  - title: '✨ 新特性'
    labels:
      - 'enhancement'
      - 'feat'
      - 'feature'
  - title: '🐛 Bug 修复'
    labels:
      - 'bug'
      - 'fix'
      - 'hotfix'
  - title: '📝 文档'
    labels:
      - 'docs'
      - 'documentation'
  - title: '⚡️ 性能优化'
    labels:
      - 'perf'
      - 'performance'
  - title: '♻️ 代码重构'
    labels:
      - 'refactor'
  - title: '✅ 测试'
    labels:
      - 'test'
      - 'testing'
  - title: '🔒 安全'
    labels:
      - 'security'
  - title: '🚀 发布 / 部署'
    labels:
      - 'release'
      - 'deploy'

# 每条变更条目的格式
change-template: '- 🔖 $TITLE @$AUTHOR (#$NUMBER)'

# 未分类的变更（没有匹配 label 的 PR）单独归入此分组
change-title-escapes: '\<*_&'

# 排除带以下 label 的 PR（例如自动化/机器人 PR）
exclude-labels:
  - 'skip-changelog'
  - 'dependencies'
  - 'bot'
