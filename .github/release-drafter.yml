# Release Drafter 配置（中文模板，基于 label 分组并在条目前添加 emoji）
# 默认 label → emoji 映射（可在 categories 中修改）：
#   ✨ enhancement / feat   — 新特性
#   🐛 bug / fix            — 修复
#   📝 docs                 — 文档
#   ⚡️ perf                 — 性能
#   ♻️ refactor             — 重构
#   ✅ test                 — 测试
#   🔒 security             — 安全
#   🚀 release              — 发布/部署
name-template: 'v$NEXT_PATCH_VERSION'
tag-template: 'v$NEXT_PATCH_VERSION'
categories:
  - title: "✨ 新特性"
    labels:
      - "enhancement"
      - "feat"
  - title: "🐛 修复"
    labels:
      - "bug"
      - "fix"
  - title: "⚡️ 性能"
    labels:
      - "perf"
  - title: "♻️ 重构"
    labels:
      - "refactor"
  - title: "📝 文档"
    labels:
      - "docs"
  - title: "✅ 测试"
    labels:
      - "test"
  - title: "🔒 安全"
    labels:
      - "security"
  - title: "🚀 发布/部署"
    labels:
      - "release"
change-template: "- $TITLE @$AUTHOR ([#$NUMBER]($URL))"
no-changes-template: "- 本次发布无显著变更记录"
template: |
  ## $TITLE

  $CHANGES

  > 如需调整 emoji 与分组，请修改 `.github/release-drafter.yml` 中的 `categories`。
