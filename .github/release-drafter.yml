# Release Drafter 配置（中文模板，基于 label 分组并在条目前添加 emoji）
# 建议安装 Release Drafter GitHub App（https://github.com/apps/release-drafter）
# 默认映射（用户已确认）：
#   ✨: enhancement, feat
#   🐛: bug, fix
#   📝: docs
#   ⚡️: perf
#   ♻️: refactor
#   ✅: test
#   🔒: security
#   🚀: release
name-template: 'v$NEXT_PATCH_VERSION'
tag-template: 'v$NEXT_PATCH_VERSION'
categories:
  - title: "✨ 新特性"
    labels:
      - "enhancement"
      - "feat"
  - title: "🐛 修复"
    labels:
      - "bug"
      - "fix"
  - title: "⚡️ 性能"
    labels:
      - "perf"
  - title: "♻️ 重构"
    labels:
      - "refactor"
  - title: "📝 文档"
    labels:
      - "docs"
  - title: "✅ 测试"
    labels:
      - "test"
  - title: "🔒 安全"
    labels:
      - "security"
  - title: "🚀 发布/部署"
    labels:
      - "release"
change-template: "- {{change}} ({{author}}){{#if pull_request}} <a>PR #{{pull_request.number}}</a>{{/if}}"
template: |
  ## {{name}} - {{date}}
  以下为本次发布的要点（按 label 分组，含 emoji）：

  {{#if changes}}
  {{#each groups}}
  ### {{title}}
  {{#each this.changes}}
  - {{this.description}} {{#if this.html_url}}<a>PR</a>{{/if}}
  {{/each}}

  {{/each}}
  {{/if}}

  > 注：本模板使用仓库 label 来分组变更。若需调整 emoji 对应关系，请修改 .github/release-drafter.yml 中的 categories。  
