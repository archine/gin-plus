name: 发布 Release（push tag 触发）

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release:
    name: 将 draft release 发布为正式 Release
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: 发布或创建 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          prerelease=false
          if [[ "${TAG_NAME}" =~ -(alpha|beta|rc|preview|dev)([.-]|$) ]]; then
            prerelease=true
          fi

          release_list="$(gh api "repos/${REPOSITORY}/releases?per_page=100")"
          release_id="$(jq -r --arg tag "${TAG_NAME}" 'map(select(.tag_name == $tag or .name == $tag)) | first | .id // empty' <<<"${release_list}")"
          release_body="$(jq -r --arg tag "${TAG_NAME}" 'map(select(.tag_name == $tag or .name == $tag)) | first | .body // empty' <<<"${release_list}")"

          if [[ -z "${release_body}" && -f CHANGELOG.md ]]; then
            # CHANGELOG 约定使用 "## [vX.Y.Z] — YYYY-MM-DD" 作为版本标题。
            release_body="$(awk -v tag="${TAG_NAME}" '
              $0 ~ "^## \\[" tag "\\]" { in_section = 1; next }
              in_section && $0 ~ "^## \\[" && $0 !~ "^## \\[" tag "\\]" { exit }
              in_section { print }
            ' CHANGELOG.md)"
          fi

          if [[ -z "${release_body}" ]]; then
            release_body="$(printf '## %s\n\n- 🚀 该版本由 tag push workflow 自动创建。\n- 📝 未找到对应的 draft release 或 CHANGELOG 条目，请按需补充发布说明。\n' "${TAG_NAME}")"
          fi

          body_file="$(mktemp)"
          printf '%s\n' "${release_body}" > "${body_file}"

          if [[ -n "${release_id}" ]]; then
            gh api \
              --method PATCH \
              "repos/${REPOSITORY}/releases/${release_id}" \
              -f tag_name="${TAG_NAME}" \
              -f name="${TAG_NAME}" \
              -F body=@"${body_file}" \
              -F draft=false \
              -F prerelease="${prerelease}"
          else
            gh api \
              --method POST \
              "repos/${REPOSITORY}/releases" \
              -f tag_name="${TAG_NAME}" \
              -f name="${TAG_NAME}" \
              -F body=@"${body_file}" \
              -F draft=false \
              -F prerelease="${prerelease}"
          fi

      # 可选：上传二进制资产
      # - name: 上传构建产物
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: |
      #     gh release upload "${{ github.ref_name }}" dist/** build/*.tar.gz --clobber
